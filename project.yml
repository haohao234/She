# ============================================================
#  HerInfo · XcodeGen 工程声明
# ============================================================
#  为什么用这个文件而不是直接给 .xcodeproj：
#
#  ① .xcodeproj 是一堆 UUID 的 XML，两个人改必冲突，diff 出来也看不懂。
#     这份 YAML 是「工程结构的唯一真相」，谁改了什么一眼看得出来。
#
#  ② 它把 README 里那六步手工操作变成了「不可遗漏的声明」：
#     最容易漏的三件事 —— 契约文件少勾一个 target、App Group 少开一边、
#     扩展的 bundle id 没挂到主 App 下面 —— 在这里都是结构性的，漏不了。
#     那三件事的共同点是：漏了不报错，只是静默功能不全。
#
#  ③ 它是「在 Windows 上也能出工程」的前提。
#     xcodegen 只读 YAML、写 .xcodeproj，不碰 Apple SDK，任何系统都能跑。
#     真正的编译仍然需要 macOS —— 但已经可以交给云端 CI 了。
#
#  用法：
#     brew install xcodegen        # 或 mint / 下载 release 二进制
#     xcodegen generate            # 生成 HerInfo.xcodeproj
#     open HerInfo.xcodeproj
# ============================================================

name: HerInfo

options:
  deploymentTarget:
    iOS: "17.0"          # SwiftData 与自定义 Layout 的门槛；降到 16 要换回 Core Data
  createIntermediateGroups: true

settings:
  base:
    # 刻意留在 Swift 5 语言模式。Swift 6 会把「严格并发」从警告升级成错误，
    # 而骨架里那几处 delegate 回调正是靠警告先暴露出来的 ——
    # 先拿到一份能编译的结果，再逐条决定怎么修（见编译预检清单第 3.1 节）。
    # 想主动复现那些并发问题：把这里改成 "6.0" 再编译。
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

    # 设计稿是 375×812 的 iPhone 竖屏（1 = iPhone）。没有做过 iPad 适配。
    TARGETED_DEVICE_FAMILY: "1"

    CODE_SIGN_STYLE: Automatic

    # ── 版本号：**必须显式给** ──────────────────────────────────
    # 三个 target 都开着 GENERATE_INFOPLIST_FILE（见各自的 settings），
    # 那个开关会拿这两个 build setting 往 Info.plist 里写
    # CFBundleShortVersionString / CFBundleVersion —— 但**它俩没设时，
    # 生成出来是空值，于是「这两个键干脆不存在」，而不是报错。**
    #
    # 后果正好卡在真机安装上：CFBundleVersion 是安装校验的必填项。
    # 本工程实测过一次 —— 打出来的 IPA 里三个 bundle 全都没有这两个键，
    # 而编译一路全绿。（现在流水线里有一条拆包断言守着它，见 ios-build.yml。）
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:

  # ----------------------------------------------------------
  #  主 App
  # ----------------------------------------------------------
  HerInfo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: HerInfo
        excludes:
          # 这三个文件各自通过 build setting 引用（INFOPLIST_FILE /
          # CODE_SIGN_ENTITLEMENTS），不能再当资源打包进 bundle 里。
          - "Info.plist"
          - "HerInfo.entitlements"
          # 两份契约不跟着文件夹走，它们在下面单独列出 ——
          # 因为它们同时属于多个 target，见下面两个 sources 条目。
          - "Shared/NotificationContract.swift"
          - "Shared/ShareContract.swift"
      # 契约：与下面的扩展 target 引用的是**同一个文件**。
      # 这是「跨进程共享」在工程层面的全部含义：
      # 同一个源文件，出现在多个 target 的 Compile Sources 里。
      #
      # 通知契约同时被三个 target 引用（主 App / 通知扩展 / 分享扩展）——
      # 分享扩展引它不是为了那几个类型，是为了 `HINotify.appGroup`
      # 与那 12 个色值（见 ShareContract.swift 文件头）。
      - path: HerInfo/Shared/NotificationContract.swift
      # 分享契约：主 App 与分享扩展两个 target 共用。
      # 主 App 侧要用它来 `drain` 收件箱（Models.swift 的 drainShareInbox）。
      - path: HerInfo/Shared/ShareContract.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herinfo.app
        INFOPLIST_FILE: HerInfo/Info.plist
        CODE_SIGN_ENTITLEMENTS: HerInfo/HerInfo.entitlements
        # 样板键（CFBundleIdentifier / CFBundleExecutable / 版本号 …）
        # 由 Xcode 自动补进上面那个文件。只在 Xcode 13 以上有效，
        # 而 iOS 17 的最低门槛本来就要求 Xcode 15，所以没有兼容问题。
        GENERATE_INFOPLIST_FILE: YES

        # ── App 图标 ────────────────────────────────────────────
        # 指向 Assets.xcassets 里那个 AppIcon 图标集（HerInfo/Assets.xcassets）。
        # 这一行是「图标到底用不用」的总开关：资源目录本身会被 sources 自动
        # 收进 Resources build phase，但**没有这一行，Xcode 不知道哪个图标集
        # 是 App 图标** —— 表现是编译全绿、装到手机上仍是默认空白图标。
        # 图标内容：暖粉底 #E2857A + 白符号（圆环 + 尾巴）。
        # 设计稿见「我的宝宝江林桐-视觉改版稿」。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    dependencies:
      # 扩展必须被「嵌入」进主 App 的 PlugIns 目录，光编译不算数。
      # embed + codeSign 是两件事：前者决定它在不在包里，
      # 后者决定它能不能在真机上被系统加载。
      - target: HerInfoNotification
        embed: true
        codeSign: true
      # 分享扩展同理。**漏了这一条的表现**：分享面板里看不到
      # 「存进她的信息本」—— 不报错，只是那一项不存在。
      - target: HerInfoShare
        embed: true
        codeSign: true

  # ----------------------------------------------------------
  #  通知内容扩展（画布 36 屏）
  # ----------------------------------------------------------
  HerInfoNotification:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: HerInfoNotification
        excludes:
          - "Info.plist"
          - "HerInfoNotification.entitlements"
      # ↓↓↓ 这是这份文件存在的最大理由 ↓↓↓
      # 契约同时属于两个 target —— README 第 5 步第 2 条要求「手动勾进
      # 两个 target 的 Compile Sources」，手工做一定会有人漏。
      # 写在这里，两个 target 共用同一个文件，物理上无法只勾一个。
      - path: HerInfo/Shared/NotificationContract.swift

    settings:
      base:
        # App 扩展的 bundle id 必须以宿主 App 的 bundle id 为前缀，
        # 否则校验期直接拒绝，或者更糟：能编译但装不上。
        PRODUCT_BUNDLE_IDENTIFIER: com.herinfo.app.notification
        INFOPLIST_FILE: HerInfoNotification/Info.plist
        CODE_SIGN_ENTITLEMENTS: HerInfoNotification/HerInfoNotification.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES      # 扩展不单独产出安装包，它只跟着主 App 走

    dependencies:
      # UNNotificationContentExtension / …ResponseOption 定义在
      # UserNotificationsUI 里（不是 UserNotifications —— 这两库名字很像，
      # 少了这一个依赖，编译期会报「cannot find type … in scope」）。
      # Swift 的自动链接通常能兜住，但显式写出来才不会在换构建方式时翻车。
      - sdk: UserNotificationsUI.framework

  # ----------------------------------------------------------
  #  分享扩展（画布 09 屏那四行系统级入口里的最后一行）
  # ----------------------------------------------------------
  #
  #  「把她的原话分享进来，自动存成一条记录」。
  #
  #  **它是全项目唯一真正需要新 target 的一项。** 需要新 target 的只有两种东西：
  #  被系统在**别的进程**里加载的代码（扩展）、以及被系统在别的进程里读的声明
  #  （plist / entitlements）。而像「快捷指令」那种（AppIntent）——
  #  从 iOS 16 起写在主 App 里就够了，那是本项目早先判断错的一条，见 README。
  HerInfoShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: HerInfoShare
        excludes:
          - "Info.plist"
          - "HerInfoShare.entitlements"
      # 分享扩展引**两份**契约，两个理由各不相同：
      #   · NotificationContract.swift —— 只要那个 App Group 名字与 12 个色值，
      #     不要它那些类型（把共享容器写成两遍，表现就是「分享进来的东西静默丢失」）
      #   · ShareContract.swift      —— 收件箱协议本体
      - path: HerInfo/Shared/NotificationContract.swift
      - path: HerInfo/Shared/ShareContract.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herinfo.app.share
        INFOPLIST_FILE: HerInfoShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: HerInfoShare/HerInfoShare.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES      # 扩展不单独产出安装包，它只跟着主 App 走

    dependencies:
      # UTType（public.plain-text / public.url）定义在这里。
      # 与 UserNotificationsUI 那条同理：显式声明，换构建方式时不翻车。
      - sdk: UniformTypeIdentifiers.framework

schemes:
  HerInfo:
    build:
      targets:
        HerInfo: all
    run:
      config: Debug
    archive:
      config: Release
