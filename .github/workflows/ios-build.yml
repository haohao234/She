# ============================================================
#  她的信息本 · iOS 编译检查
# ============================================================
#  这个工作流的唯一目的是：**让真正的编译器说话**。
#
#  本机是 Windows，没有 Xcode。上一轮我逐行静态通读了 5524 行，
#  但有三类问题只有编译器能裁决（#Predicate 宏捕获、Swift 6 严格并发、
#  自定义 Layout 边界）。GitHub 的 macOS runner 上装着完整的 Xcode，
#  把代码推上来就能换回一份真实的错误清单。
#
#  【为什么不用它做「测试」】
#  这里只编译、不跑模拟器、不做签名。因为当前阶段要的不是
#  「App 跑起来了吗」，而是「它编译得过吗」。编译过了再谈跑。
#
#  【免费额度】
#  公开仓库：不限时。私有仓库：每月 2000 分钟（macOS runner 按 10 倍
#  计费，即实际可用 200 分钟 ≈ 40 次编译）。这个工作流单次约 3–5 分钟。
# ============================================================

name: iOS 编译检查

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:        # 也允许在网页上手动点一下就跑

jobs:
  build:
    name: xcodebuild（不签名）
    runs-on: macos-15

    steps:
      # v4 系列的运行时是 Node 20，GitHub 已经在告警「Node.js 20 is deprecated」，
      # 并把它强制跑在 Node 24 上 —— 这条告警会挂在 check run 的注解里，
      # 和我们真正要看的「Swift 编译错误」混在一起。升到 v5（Node 24）消掉它：
      # 这条流水线是唯一的编译信号，注解区应该只留编译器的声音。
      - uses: actions/checkout@v5

      - name: 环境信息
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen 并生成工程
        run: |
          brew install xcodegen
          xcodegen generate
          echo "--- 生成的工程 ---"
          ls -d *.xcodeproj

      # ── 为什么是 Release 而不是 Debug ─────────────────────────
      # 一开始这里写的是 Debug（编译更快），但那会让产物**装上却跑不起来**：
      # Xcode 16 给 Debug 配置默认开了一个「调试动态库」
      # （ENABLE_DEBUG_DYLIB，为 SwiftUI 预览服务）—— 实测包里躺着
      # `HerInfo.debug.dylib` **7.7 MB**，而主可执行文件只剩 **71 KB 的壳**。
      # 那个壳靠 @rpath 在运行时加载 dylib，于是：
      #   · 侧载工具要额外把那个 dylib 也签一遍，多一处会失败的地方；
      #   · 真机启动要先解析 @rpath，侧载场景下路径未必对得上。
      # 真机验证要的是「能装、能跑」，不是「编译快」，所以换成 Release。
      # ENABLE_DEBUG_DYLIB=NO 是第二层保险 —— Release 本来就不带，
      # 显式写出来是为了**防止哪天有人把配置改回 Debug**。
      - name: 编译
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project HerInfo.xcodeproj \
            -scheme HerInfo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ENABLE_DEBUG_DYLIB=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      # 编译失败时上面的步骤会红，但真正要给人看的是「错误清单」，
      # 而不是 3000 行构建日志。这一段把它摘出来。
      - name: 摘出错误与警告
        if: always()
        run: |
          echo "=========================================="
          echo " 错误（error）"
          echo "=========================================="
          grep -E "^[^ ]+:[0-9]+:[0-9]+: error:" build.log | sort -u || echo "（无）"
          echo ""
          echo "=========================================="
          echo " 警告（warning）"
          echo "=========================================="
          grep -E "^[^ ]+:[0-9]+:[0-9]+: warning:" build.log | sort -u || echo "（无）"
          echo ""
          echo "------------------------------------------"
          echo "error 总数：$(grep -cE ': error:' build.log || true)"
          echo "warning 总数：$(grep -cE ': warning:' build.log || true)"

      # ── 把「0 warning」从声明变成断言 ────────────────────────
      # 这个工程对外一直写着「0 error / 0 warning」，但那是**声明** ——
      # 结果第 12 轮起混进了一条 warning 却没人发现，因为只看绿勾、不看条数。
      # 现在让它自己红：有 warning 就失败。
      #
      # 【红了不等于改坏了】runner 的 Xcode 升级也可能带来新的
      # deprecation 警告。那种情况看上面那份清单就知道是什么，
      # 改掉、或者明确写进文档说「这条接受」，两条路都行 ——
      # 唯独不能让它**静静地**躺在日志里。
      - name: 把 warning 也当失败（这个工程承诺 0 警告）
        if: success()
        run: |
          N=$(grep -cE ': warning:' build.log || true)
          if [ "$N" != "0" ]; then
            echo "::error::$N 条 warning —— 这个工程承诺 0 warning。清单见上面「警告（warning）」那段。"
            exit 1
          fi
          echo "✓ warning 0 条 —— 与文档里的承诺一致"

      # ── 打包成可侧载的 IPA（为真机验证加的）─────────────────
      # 上面编出来的 .app 是**不签名**的（runner 上没有任何签名身份），
      # 但它已经是 arm64 的**设备构建** —— Sideloadly 可以拿它当输入，
      # 用你自己的 Apple ID 在 Windows 那侧重新签名后装进手机。
      #
      # IPA 本身没有任何魔法：就是「一个叫 Payload 的文件夹里放 .app」再 zip。
      # 所以不签名也能打；签名不是这一步的事。
      #
      # 打不出来的情况只有两种：产物路径变了（下面会自己找并把候选打出来）、
      # 或者扩展没被嵌进去（那样也能装，但通知/分享两条线是死的 —— 所以也一并打出来看）。
      - name: 打成可侧载的 IPA（不签名）
        if: success()
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::没找到 .app —— 构建产物路径变了？下面是 build 里的全部 .app："
            find build -maxdepth 5 -name "*.app" -type d || true
            exit 1
          fi
          echo "找到：$APP"
          echo "--- 嵌进去的扩展（应该是 2 个 .appex）---"
          ls -1 "$APP/PlugIns" 2>/dev/null || echo "::warning::没有 PlugIns —— 扩展没被嵌进去，装上后通知与分享两条线是死的"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          IPA="HerInfo-${SHORT}-unsigned.ipa"
          zip -qry "$IPA" Payload
          echo "打好：$IPA"
          ls -lh "$IPA"

      # ── 拆包自检（不然缺陷会一路走到手机上）────────────────────
      # 下面三项都是**编译全绿也照样存在**的问题，只有把包拆开才看得见。
      # 它们的共同点是：造出来的包「看起来正常」，装的时候才拒。
      #
      # ① 扩展数量 —— 少嵌一个，装得上、主 App 照跑，只是那条线在界面上
      #    看不出来地死掉。所以按数字判，不按「看着对不对」判。
      # ② 版本键缺失 —— 三个 target 都开 GENERATE_INFOPLIST_FILE，
      #    而 MARKETING_VERSION / CURRENT_PROJECT_VERSION 没设时，
      #    生成出来的是空值，于是这两个键**根本不存在**（不报错）。
      #    本工程实测过一次：真机上被拒的原话是
      #      bundleVersion must be set in placeholder attributes
      #      for an app extension placeholder
      #    —— 注意它**只点名扩展**：主 App 的 placeholder 允许缺版本，
      #    扩展的不允许，于是三个 bundle 都带病的包，报错点落在 .appex 上。
      # ③ Debug 配置的调试动态库 —— 见上面「为什么是 Release」那段。
      #
      # 放在上传之前：坏的包**不该变成用户能下载的 artifact**。
      # 用户是照着指引去点 Artifacts 的人，他不会拆包看版本键。
      - name: 校验 IPA 内容（扩展数量 / 版本键 / 调试动态库）
        if: success()
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          FAIL=0

          echo "=========================================="
          echo " 嵌进来的扩展（应为 2 个）"
          echo "=========================================="
          ls -1 "$APP/PlugIns" 2>/dev/null || echo "（没有 PlugIns 目录）"
          N_APPEX=$(find "$APP/PlugIns" -maxdepth 1 -name "*.appex" -type d 2>/dev/null | wc -l | tr -d ' ')
          if [ "$N_APPEX" != "2" ]; then
            echo "::error::PlugIns 里有 $N_APPEX 个 .appex，应为 2 个（HerInfoNotification / HerInfoShare）—— 查 project.yml 里两条 embed 声明"
            FAIL=1
          else
            echo "  OK   2 个 .appex"
          fi

          echo ""
          echo "=========================================="
          echo " 版本键（应为主 1.0 / 构建 1）"
          echo "=========================================="
          APP_BUILD=$(plutil -extract CFBundleVersion raw "$APP/Info.plist" 2>/dev/null || echo "")
          APP_SHORT=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist" 2>/dev/null || echo "")
          if [ -z "$APP_SHORT" ] || [ -z "$APP_BUILD" ]; then
            echo "::error::$(basename "$APP") 缺版本键（Short='$APP_SHORT' Build='$APP_BUILD'）—— 查 project.yml 的 MARKETING_VERSION / CURRENT_PROJECT_VERSION"
            FAIL=1
          else
            echo "  OK   $(basename "$APP")   $APP_SHORT ($APP_BUILD)"
          fi
          # 扩展的版本必须与宿主 App **相同**（Apple 的硬要求，不是我们的偏好）。
          # 不一致时报错长得像别的问题，所以这里显式比一遍。
          for b in "$APP"/PlugIns/*.appex; do
            [ -d "$b" ] || continue
            NAME=$(basename "$b")
            SHORT=$(plutil -extract CFBundleShortVersionString raw "$b/Info.plist" 2>/dev/null || echo "")
            BUILD=$(plutil -extract CFBundleVersion raw "$b/Info.plist" 2>/dev/null || echo "")
            if [ -z "$SHORT" ] || [ -z "$BUILD" ]; then
              echo "::error::$NAME 缺版本键（Short='$SHORT' Build='$BUILD'）—— 查 project.yml 的 MARKETING_VERSION / CURRENT_PROJECT_VERSION"
              FAIL=1
            elif [ "$BUILD" != "$APP_BUILD" ] || [ "$SHORT" != "$APP_SHORT" ]; then
              echo "::error::$NAME 的版本（$SHORT / $BUILD）与主 App（$APP_SHORT / $APP_BUILD）不一致 —— 扩展版本必须与宿主相同，否则真机装不上"
              FAIL=1
            else
              echo "  OK   $NAME   $SHORT ($BUILD)"
            fi
          done

          echo ""
          echo "=========================================="
          echo " 调试动态库（Release 构建不应有）"
          echo "=========================================="
          if find "$APP" -name "*.debug.dylib" | grep -q .; then
            echo "::error::包里带着 *.debug.dylib —— 这是 Debug 配置的产物。侧载要多签一道、真机启动还要解析 @rpath。查 xcodebuild 的构建配置。"
            find "$APP" -name "*.debug.dylib" -exec ls -lh {} \;
            FAIL=1
          else
            echo "  OK   没有调试动态库"
          fi
          EXEC=$(plutil -extract CFBundleExecutable raw "$APP/Info.plist" 2>/dev/null || echo "HerInfo")
          echo "  主可执行文件：$(ls -lh "$APP/$EXEC" | awk '{print $5}')  ($EXEC)"

          exit $FAIL

      - name: 上传 IPA
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: HerInfo-ipa
          path: HerInfo-*-unsigned.ipa
          retention-days: 30

      - name: 保存完整日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          retention-days: 14
